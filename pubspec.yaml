name: shopx
description: "ShopX App."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  # A flutter plugin for adapting screen and font size.Guaranteed to look good on different models.
  flutter_screenutil: ^5.9.3
  # Flutter plugin for reading and writing simple key-value pairs. Wraps NSUserDefaults on iOS and SharedPreferences on Android.
  shared_preferences: ^2.5.3
  # networking package, supports Interceptors, Aborting and canceling a request, Custom adapters, Transformers, etc.
  dio: ^5.9.0
  # A carousel slider widget, support infinite scroll and custom child widget.
  carousel_slider: ^5.1.1
  # State management library that helps implement the BLoC (Business Logic Component) design pattern.
  flutter_bloc: ^9.1.1
  # Customize Flutter's default white native splash screen with background color and splash image. Supports dark mode, full screen, and more.
  flutter_native_splash: ^2.4.7
  # Package for easy use of images that are automatically cacheable and have a beautiful on the fly (but it can be configured) shimmer effect while loading.
  fancy_shimmer_image: ^2.0.3
  # Converts already built widgets into skeleton loaders with no extra effort.
  skeletonizer: ^2.1.0+1
  # A Flutter plugin to use the Firebase Core API, which enables connecting to multiple Firebase apps.
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  # A Flutter plugin to use the Firebase Cloud Messaging API to send and receive push notifications.
  google_sign_in: ^6.0.0
  # A Flutter plugin that provides Facebook authentication.
  flutter_facebook_auth: ^6.0.0
  # A Flutter package to show toast messages in Android and iOS.
  fluttertoast: ^9.0.0
  # A simple service locator for Dart and Flutter projects to decouple the interface from concrete implementations.
  get_it: ^9.0.5
  # Functional programming in Dart, with Either, Option, Task, and more.
  dartz: ^0.10.1
  # A Flutter package to render SVG (Scalable Vector Graphics) files.
  flutter_svg: ^2.2.3
  # A Flutter package to display AVIF images with high performance and low memory usage.
  flutter_avif: ^2.2.0
  # A Flutter package that provides a customizable phone number input field with country code selection and validation.
  intl_phone_field: ^3.2.0



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: "^0.14.4"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/categories/
    - assets/images/bag/
    - assets/images/banners/
    - assets/images/logos/
    - assets/svg/

